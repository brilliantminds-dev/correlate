name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      GOPATH: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: 'true'
          cache-dependency-path: 'go.sum'
          go-version: 'stable'
      - name: Install checkov
        run: go install github.com/bridgecrewio/checkov/cmd/checkov@latest
      - name: Install go-sec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Install go-imports
        run: go install golang.org/x/tools/cmd/goimports@latest
      - name: Install go-critic
        run: go install github.com/go-critic/go-critic/cmd/go-critic@latest
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run static analysis
        run: |
          echo "running static analysis"
          result_checkov=$(checkov -d . --quiet --skip-framework-checks)
          if [[ $result_checkov != "Passed checks: 0, Failed checks: 0, Skipped checks: 0" ]]; then
          echo "checkov failed. result: $result_checkov"
          exit 1
          result_license=$(go-licenses csv -exclude-dir=vendor -exclude-dir=test -exclude=G404)
          if [[ $? != 0 ]]; then
          echo "go-licenses failed. result: $result_license"
          exit 1
          result_govuln=$(govulncheck -mod=readonly -format=json ./...)
          if [[ $? != 0 ]]; then
          echo "govulncheck failed. result: $result_govuln"
          exit 1
          echo "done running static analysis. all checks passed"
      - name: Run SCA scan
        uses: securego/gosec@master
        with:
          args: -quiet -exclude-dir=vendor -exclude-dir=test -exclude=G404 ./...

      - name: Run pre-commit hooks
        id: pre-commit
        if: always() # always run pre-commit hooks
        continue-on-error: false # cancel the step if any hook fails
        timeout-minutes: 10 # cancel the step if it takes longer than 10 minutes
        uses: pre-commit/action@v3.0.1
  test:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          architecture: '64' # architectures: [amd64, arm64]
          go-version: 'stable' #versions: https://github.com/actions/setup-go/releases
      - name: Run tests with coverage check
        run: |
          echo "running tests with config file .testcoverage.yml"
          go test -v -coverprofile=coverage.out ./...
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-report
          path: cover.out
          retention-days: 5

      - name: Assert test coverage is above 80%
        uses: vladopajic/go-test-coverage@v2
        with:
          config: .testcoverage.yml