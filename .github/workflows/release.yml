name: Correlate Managed Pipeline

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: [ "Build" ]
    types:
      - completed
permissions:
  contents: write


jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Correlate - Checkout Stage
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correlate - Go Setup
        uses: actions/setup-go@v5
        with:
          go-version: '1.24' # Replace with your target Go version

      - name: Correlate - Publish | Release Version
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          changelog-file: CHANGELOG.md
