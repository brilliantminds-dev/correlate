name: Correlate Managed Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write


jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1 #
  test:
    runs-on: ubuntu-latest
    
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Correlate - Checkout Stage
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correlate - Go Setup
        uses: actions/setup-go@v5
        with:
          go-version: '1.24' # Replace with your target Go version

      - name: Correlate - Publish | Release Version
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          changelog-file: CHANGELOG.md
