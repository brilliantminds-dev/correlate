# See https://pre-commit.com for more information
repos:
  # Basic code hygiene (whitespaces and formatting rules)
  - repo: https://github.com
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Go Linters, Format, and Vet (All-in-one bundle via golangci-lint)
  - repo: https://github.com
    rev: v1.64.5
    hooks:
      - id: golangci-lint
        name: golangci-lint (includes vet and format)
        entry: golangci-lint run --issues-exit-code=1

  # Go Vulnerability Check
  - repo: https://github.com
    rev: v0.1.0
    hooks:
      - id: govulncheck
        name: govulncheck
        entry: govulncheck ./...
        types: [go]
        language: system # Requires govulncheck to be installed on the machine
