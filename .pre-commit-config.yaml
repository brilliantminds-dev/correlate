# See https://pre-commit.com for more information
repos:
  # Basic code hygiene (whitespaces and formatting rules)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Go Linters, Format, and Vet (All-in-one bundle via golangci-lint)
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-mod-tidy
      - id: go-critic
      - id: go-build
      - id: golangci-lint
        name: golangci-lint (includes vet and format)
        entry: golangci-lint run --issues-exit-code=0
